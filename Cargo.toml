[workspace]
resolver = "2"
members = [
    "crates/ieee754-core",
    "apps/desktop",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["IEEE 754 Explorer Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ieee754-core = { path = "crates/ieee754-core" }
