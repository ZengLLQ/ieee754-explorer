[package]
name = "ieee754-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "IEEE 754 Explorer — Windows Desktop Application (Tauri 2)"
default-run = "ieee754-desktop"

[lib]
name = "ieee754_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ieee754-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ieee754-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
